# ValueInsight Nginx 配置
# 将此文件放到 /etc/nginx/sites-available/valueinsight.conf
# 然后执行：ln -s /etc/nginx/sites-available/valueinsight.conf /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
#
# HTTPS 启用步骤（服务器上执行，一次性）：
#   1. 确保域名解析到服务器公网 IP，然后：
#      certbot --nginx -d your-domain.com
#   2. certbot 会自动改本配置并申请证书；或将下方 443 块的证书路径改为实际路径
#
# 可选：nginx 层 IP 限流（在 /etc/nginx/nginx.conf 的 http{} 内加一行，再在下方 server 内启用）：
#   http {
#       limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
#   }
#   server 内启用：limit_req zone=api burst=20 nodelay;

server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名或 ECS 公网 IP

    # 客户端请求体大小限制（允许上传文件）
    client_max_body_size 10m;

    # 安全响应头
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 主应用反向代理
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存（Next.js 静态文件）
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}

# ===== HTTPS（证书就绪后启用，同时建议把上方 80 块改为 301 跳转）=====
# 80 → 443 跳转（certbot 申请后默认生成；手动启用时取消下方注释）：
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 443 ssl;
    server_name your-domain.com;

    # 证书路径（certbot 自动申请后自动替换；手动配置请改实际路径）
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # 安全响应头
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
